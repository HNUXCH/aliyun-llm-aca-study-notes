  <text x="736" y="522" text-anchor="start" dominant-baseline="central" fill="#1a1a1a" font-size="20" font-weight="400" font-family="'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, Tahoma">指的是全聚德前门店，</text>
