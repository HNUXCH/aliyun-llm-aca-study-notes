<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 74 832 426">
  <!-- 设计意图：开篇建立直觉：Agent 接触真实业务材料前，需要安全边界。科技感、少线条、强中心。 -->
  <!-- 信息骨架：中心 Agent + 4 个风险入口 + 1 个安全边界；静态 16:9 SVG -->
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0033CC"/>
      <stop offset="100%" stop-color="#6281E0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0033CC" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="64" y="74" width="832" height="426" rx="8" fill="#FFFFFF"/>

  <circle cx="480" cy="260" r="128" fill="#FFFFFF" stroke="#D8E1FF" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="480" cy="260" r="100" fill="none" stroke="#0033CC" stroke-width="2" stroke-dasharray="9,7" opacity="0.45"/>
  <circle cx="480" cy="260" r="72" fill="url(#blueGrad)"/>
  <text x="480" y="244" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="18" font-weight="700" fill="#FFFFFF">Agent</text>
  <text x="480" y="270" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FFFFFF">读资料、调工具</text>
  <text x="480" y="292" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FFFFFF">生成结果</text>
  <text x="480" y="128" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0033CC">安全边界</text>

  <rect x="92" y="104" width="220" height="96" rx="14" fill="url(#panelGrad)" stroke="#FF6A00" stroke-width="1.8"/>
  <rect x="112" y="124" width="30" height="30" rx="6" fill="#FFF3EA" stroke="#FF6A00" stroke-width="1.2"/>
  <path d="M120 134H134M120 142H132M120 150H136" stroke="#FF6A00" stroke-width="1.6" stroke-linecap="round"/>
  <text x="156" y="132" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="14" font-weight="700" fill="#000000">外部资料</text>
  <text x="156" y="158" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">网页、PDF、搜索结果</text>
  <text x="156" y="180" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FF6A00">可能夹带木马指令</text>

  <rect x="648" y="104" width="220" height="96" rx="14" fill="url(#panelGrad)" stroke="#FF6A00" stroke-width="1.8"/>
  <rect x="668" y="124" width="30" height="30" rx="6" fill="#FFF3EA" stroke="#FF6A00" stroke-width="1.2"/>
  <path d="M683 130C678 130 675 134 675 139C675 145 678 150 683 150C688 150 691 145 691 139C691 134 688 130 683 130Z" fill="none" stroke="#FF6A00" stroke-width="1.5"/>
  <path d="M674 154C677 150 689 150 692 154" stroke="#FF6A00" stroke-width="1.5" stroke-linecap="round"/>
  <text x="712" y="132" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="14" font-weight="700" fill="#000000">业务数据</text>
  <text x="712" y="158" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">手机号、合同、备注</text>
  <text x="712" y="180" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FF6A00">需要先脱敏</text>

  <rect x="92" y="320" width="220" height="96" rx="14" fill="url(#panelGrad)" stroke="#FF6A00" stroke-width="1.8"/>
  <rect x="112" y="340" width="30" height="30" rx="6" fill="#FFF3EA" stroke="#FF6A00" stroke-width="1.2"/>
  <path d="M119 348H135V364H119Z" fill="none" stroke="#FF6A00" stroke-width="1.5"/>
  <path d="M123 352H131M123 356H131M123 360H128" stroke="#FF6A00" stroke-width="1.3" stroke-linecap="round"/>
  <text x="156" y="348" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="14" font-weight="700" fill="#000000">企业知识库</text>
  <text x="156" y="374" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">产品、合同、报价策略</text>
  <text x="156" y="396" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FF6A00">必须按权限访问</text>

  <rect x="648" y="320" width="220" height="96" rx="14" fill="url(#panelGrad)" stroke="#FF6A00" stroke-width="1.8"/>
  <rect x="668" y="340" width="30" height="30" rx="6" fill="#FFF3EA" stroke="#FF6A00" stroke-width="1.2"/>
  <path d="M675 350H691M675 356H687M675 362H692" stroke="#FF6A00" stroke-width="1.5" stroke-linecap="round"/>
  <text x="712" y="348" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="14" font-weight="700" fill="#000000">公开输出</text>
  <text x="712" y="374" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">报告、邮件、公众号</text>
  <text x="712" y="396" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FF6A00">发布前要核查</text>

  <path d="M312 152C360 160 394 190 414 214" fill="none" stroke="#0033CC" stroke-width="1.4" opacity="0.32"/>
  <path d="M648 152C600 160 566 190 546 214" fill="none" stroke="#0033CC" stroke-width="1.4" opacity="0.32"/>
  <path d="M312 368C360 360 394 330 414 306" fill="none" stroke="#0033CC" stroke-width="1.4" opacity="0.32"/>
  <path d="M648 368C600 360 566 330 546 306" fill="none" stroke="#0033CC" stroke-width="1.4" opacity="0.32"/>

  <rect x="286" y="444" width="388" height="32" rx="8" fill="#0033CC"/>
  <text x="480" y="465" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#FFFFFF">AI 能做事之前，先确认资料、权限、输出都安全</text>
</svg>
