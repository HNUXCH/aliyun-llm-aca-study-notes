<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 960 470" role="img" aria-labelledby="title desc">
  <title id="title">预训练数据来源、治理与模型能力</title>
  <desc id="desc">大量广泛的数据来源进入数据治理流程，经过清洗、安全和合规处理后形成高质量预训练语料库。Qwen3 预训练语料达到 36 万亿 tokens。</desc>
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0033CC"/>
      <stop offset="1" stop-color="#6281E0"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#E8EEFF"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#FFB26B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0033CC" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0033CC"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,1 L9,5 L0,9 Z" fill="#5E5E5E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" rx="8" fill="#FFFFFF"/>

  <g transform="translate(42 54)">
    <rect x="0" y="0" width="232" height="382" rx="12" fill="#F7FAFF" stroke="#D7E5FF"/>
    <rect x="18" y="20" width="196" height="38" rx="9" fill="#0033CC"/>
    <text x="116" y="44" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="14" font-weight="700" fill="#FFFFFF">广泛数据来源</text>
    <text x="116" y="76" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">不同来源带来不同语言和知识</text>

    <g transform="translate(18 86)" filter="url(#shadow)">
      <rect x="0" y="0" width="92" height="62" rx="8" fill="#FFFFFF" stroke="#C9DAFF"/>
      <rect x="9" y="14" width="28" height="22" rx="3" fill="#E8EEFF" stroke="#0033CC"/>
      <line x1="13" y1="22" x2="33" y2="22" stroke="#6281E0" stroke-width="1.4"/>
      <line x1="13" y1="30" x2="29" y2="30" stroke="#6281E0" stroke-width="1.4"/>
      <text x="44" y="27" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#111827">网页</text>
      <text x="44" y="45" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">通用知识</text>
    </g>
    <g transform="translate(122 86)" filter="url(#shadow)">
      <rect x="0" y="0" width="92" height="62" rx="8" fill="#FFFFFF" stroke="#C9DAFF"/>
      <path d="M11 15 L35 10 L35 45 L11 50 Z" fill="#E8EEFF" stroke="#0033CC"/>
      <line x1="16" y1="23" x2="30" y2="20" stroke="#6281E0" stroke-width="1.4"/>
      <line x1="16" y1="32" x2="30" y2="29" stroke="#6281E0" stroke-width="1.4"/>
      <text x="44" y="27" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#111827">书籍</text>
      <text x="44" y="45" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">长文本</text>
    </g>

    <g transform="translate(18 166)" filter="url(#shadow)">
      <rect x="0" y="0" width="92" height="62" rx="8" fill="#FFFFFF" stroke="#C9DAFF"/>
      <rect x="9" y="14" width="30" height="30" rx="5" fill="#E8EEFF" stroke="#0033CC"/>
      <path d="M18 24 L13 29 L18 34" fill="none" stroke="#0033CC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 24 L35 29 L30 34" fill="none" stroke="#0033CC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="27" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#111827">代码</text>
      <text x="44" y="45" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">程序能力</text>
    </g>
    <g transform="translate(122 166)" filter="url(#shadow)">
      <rect x="0" y="0" width="92" height="62" rx="8" fill="#FFFFFF" stroke="#C9DAFF"/>
      <circle cx="20" cy="24" r="10" fill="#E8EEFF" stroke="#0033CC"/>
      <path d="M15 38 Q20 46 31 42" fill="none" stroke="#6281E0" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="35" cy="34" r="6" fill="#E8EEFF" stroke="#0033CC"/>
      <text x="44" y="27" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#111827">社交</text>
      <text x="44" y="45" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">对话语感</text>
    </g>

    <g transform="translate(18 246)" filter="url(#shadow)">
      <rect x="0" y="0" width="92" height="62" rx="8" fill="#FFFFFF" stroke="#C9DAFF"/>
      <rect x="10" y="13" width="28" height="36" rx="3" fill="#E8EEFF" stroke="#0033CC"/>
      <line x1="16" y1="24" x2="27" y2="24" stroke="#6281E0" stroke-width="1.4"/>
      <line x1="16" y1="33" x2="27" y2="33" stroke="#6281E0" stroke-width="1.4"/>
      <line x1="16" y1="42" x2="27" y2="42" stroke="#6281E0" stroke-width="1.4"/>
      <text x="44" y="27" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#111827">法律</text>
      <text x="44" y="45" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">严谨文本</text>
    </g>
    <g transform="translate(122 246)" filter="url(#shadow)">
      <rect x="0" y="0" width="92" height="62" rx="8" fill="#FFFFFF" stroke="#C9DAFF"/>
      <path d="M12 44 L24 18 L36 44 Z" fill="#E8EEFF" stroke="#0033CC"/>
      <circle cx="24" cy="29" r="4" fill="#FFFFFF" stroke="#0033CC"/>
      <text x="44" y="27" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#111827">论文</text>
      <text x="44" y="45" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">专业推理</text>
    </g>
    <rect x="18" y="326" width="196" height="38" rx="8" fill="#FFFFFF" stroke="#FFB26B"/>
    <text x="116" y="350" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#FF6A00">来源广，规模大</text>
  </g>

  <path d="M284 224 L366 224" fill="none" stroke="#0033CC" stroke-width="2" opacity="0.55" marker-end="url(#arrowBlue)"/>
  <text x="325" y="210" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">汇入治理</text>

  <g transform="translate(382 86)" filter="url(#shadow)">
    <path d="M0 0 L214 0 L174 294 L40 294 Z" fill="url(#softBlue)" stroke="#B8CBFF" stroke-width="1.2"/>
    <rect x="34" y="34" width="146" height="52" rx="8" fill="#FFFFFF" stroke="#0033CC"/>
    <text x="107" y="52" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0033CC">阶段一：清洗</text>
    <text x="107" y="74" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">去重、去噪、低质过滤</text>
    <rect x="45" y="121" width="124" height="52" rx="8" fill="#FFFFFF" stroke="#0033CC"/>
    <text x="107" y="139" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0033CC">阶段二：安全</text>
    <text x="107" y="161" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">脱敏、有害内容过滤</text>
    <rect x="56" y="208" width="102" height="52" rx="8" fill="#FFFFFF" stroke="#0033CC"/>
    <text x="107" y="226" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0033CC">阶段三：合规</text>
    <text x="107" y="248" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">授权、审查、留痕</text>
  </g>

  <path d="M592 234 C626 234 638 234 666 234" fill="none" stroke="#5E5E5E" stroke-width="1.5" opacity="0.65" marker-end="url(#arrowGray)"/>

  <g transform="translate(680 118)" filter="url(#shadow)">
    <rect x="0" y="0" width="224" height="238" rx="9" fill="#FFFFFF" stroke="#0033CC" stroke-width="1.2"/>
    <rect x="18" y="20" width="188" height="38" rx="9" fill="#0033CC"/>
    <text x="112" y="44" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="14" font-weight="700" fill="#FFFFFF">高质量预训练语料库</text>
    <rect x="26" y="82" width="172" height="24" rx="6" fill="#F7FAFF" stroke="#D7E5FF"/>
    <text x="112" y="99" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">清洗过滤有害内容</text>
    <rect x="26" y="116" width="172" height="24" rx="6" fill="#F7FAFF" stroke="#D7E5FF"/>
    <text x="112" y="133" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">去标识化个人信息</text>
    <rect x="26" y="150" width="172" height="24" rx="6" fill="#F7FAFF" stroke="#D7E5FF"/>
    <text x="112" y="167" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">平衡采样小众语言</text>
    <rect x="26" y="184" width="172" height="24" rx="6" fill="#FFF7ED" stroke="#FFB26B"/>
    <text x="112" y="201" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#FF6A00">人工与伦理审核</text>
    <text x="112" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="11" fill="#5E5E5E">Qwen3：36万亿 tokens</text>
  </g>

  <g transform="translate(104 442)">
    <rect x="0" y="0" width="752" height="48" rx="12" fill="#0033CC"/>
    <text x="376" y="30" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="14" font-weight="700" fill="#FFFFFF">训练大模型，需要来源广泛、清洗充分、经过安全和合规审核的高质量语料库</text>
  </g>
</svg>
