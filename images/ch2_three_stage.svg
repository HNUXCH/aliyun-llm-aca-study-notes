<!-- 模式：阶梯递进 (Staircase) — 课时3 三步能力递进 -->
<!-- 概念类图：静态，无动画 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="100%" height="100%" fill="#fff" rx="8"/>

  <!-- 基线 + 纵轴 -->
  <line x1="60" y1="500" x2="922" y2="500" stroke="#D8E0F5" stroke-width="2"/>
  <line x1="60" y1="500" x2="60" y2="40" stroke="#0033CC" stroke-width="2"/>
  <polygon points="55,50 60,34 65,50" fill="#0033CC"/>
  <text x="38" y="270" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0033CC" transform="rotate(-90, 38, 270)">能力递进</text>

  <!-- 递进引导斜线 -->
  <!-- 递进引导斜线：连接三个圆心，圆在线上方自然遮挡中间段 -->
  <line x1="112" y1="286" x2="684" y2="50" stroke="#6281E0" stroke-width="2" stroke-dasharray="7,5" opacity="0.55"/>
  <polygon points="684,50 676,56 690,58" fill="#6281E0" opacity="0.75"/>
  <text x="480" y="80" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#6281E0" opacity="0.9">一步步把能力往上堆</text>

  <!-- 台阶 1：把任务说清楚 -->
  <g>
    <rect x="74" y="286" width="286" height="214" rx="8" fill="#E8EEFF" stroke="#C9D6F5" stroke-width="1"/>
    <text x="330" y="494" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="104" font-weight="900" fill="#6281E0" opacity="0.16">1</text>
    <circle cx="112" cy="286" r="22" fill="#fff" stroke="#0033CC" stroke-width="2"/>
    <text x="112" y="293" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#0033CC">1</text>
    <text x="96" y="336" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#1a1a1a">把任务说清楚</text>
    <text x="96" y="378" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#5E5E5E">补全要素、正反样例、不带倾向</text>
    <text x="96" y="404" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#5E5E5E">一次性把任务讲清楚</text>
  </g>

  <!-- 台阶 2：复杂任务协同 -->
  <g>
    <rect x="360" y="168" width="286" height="332" rx="8" fill="#6281E0"/>
    <text x="608" y="490" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="104" font-weight="900" fill="#fff" opacity="0.13">2</text>
    <circle cx="398" cy="168" r="22" fill="#fff" stroke="#0033CC" stroke-width="2"/>
    <text x="398" y="175" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#0033CC">2</text>
    <text x="382" y="224" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#fff">复杂任务协同</text>
    <text x="382" y="272" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#EAF0FF">采访 · 调研 · 计划</text>
    <text x="382" y="298" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#EAF0FF">分段执行 · 自检</text>
  </g>

  <!-- 台阶 3：沉淀复用工具 -->
  <g>
    <rect x="646" y="50" width="286" height="450" rx="8" fill="#0033CC"/>
    <text x="894" y="488" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="104" font-weight="900" fill="#fff" opacity="0.13">3</text>
    <circle cx="684" cy="50" r="22" fill="#fff" stroke="#0033CC" stroke-width="2"/>
    <text x="684" y="57" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#0033CC">3</text>
    <text x="668" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#fff">沉淀复用工具</text>
    <text x="668" y="160" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#EAF0FF">提示词模板 · 验证器</text>
    <text x="668" y="186" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#EAF0FF">形成反馈闭环</text>
  </g>
</svg>
