<!-- 模式：并列卡片 (Parallel Cards) — 课时3 补全信息要素·四件套 -->
<!-- 动画：SMIL 9s 周期循环 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0033CC"/>
      <stop offset="100%" stop-color="#6281E0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#fff" rx="8"/>

  <!-- 卡片 1：角色（实填） — 0.4s -->
  <g>
    <rect x="40" y="30" width="196" height="320" rx="8" fill="#FAFBFF" stroke="#C5D4F5" stroke-width="1.5"/>
    <path d="M40,42 Q40,30 52,30 L224,30 Q236,30 236,42 L236,84 L40,84 Z" fill="#0033CC"/>
    <text x="138" y="63" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#fff">角色</text>
    <g transform="translate(138,132)">
      <circle cx="0" cy="-8" r="9" fill="#0033CC" opacity="0.85"/>
      <path d="M-15,16 Q-15,-1 0,-1 Q15,-1 15,16 Z" fill="#0033CC" opacity="0.85"/>
    </g>
    <text x="138" y="200" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#333">指定专业身份</text>
    <text x="138" y="225" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#333">回答就有立场</text>
    <rect x="44" y="280" width="188" height="34" rx="17" fill="#E8EEFF"/>
    <text x="138" y="302" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#0033CC">如：电商运营分析助手</text>
  </g>

  <!-- 卡片 2：任务（渐变） — 0.8s -->
  <g>
    <rect x="264" y="30" width="196" height="320" rx="8" fill="#FAFBFF" stroke="#C5D4F5" stroke-width="1.5"/>
    <path d="M264,42 Q264,30 276,30 L448,30 Q460,30 460,42 L460,84 L264,84 Z" fill="url(#grad4)"/>
    <text x="362" y="63" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#fff">任务</text>
    <g transform="translate(362,132)">
      <circle cx="0" cy="4" r="15" fill="none" stroke="#0033CC" stroke-width="1.5" opacity="0.5"/>
      <circle cx="0" cy="4" r="9" fill="none" stroke="#0033CC" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="4" r="3.5" fill="#0033CC"/>
    </g>
    <text x="362" y="200" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#333">一句话说清目标</text>
    <text x="362" y="225" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#333">对象、时间要具体</text>
    <rect x="268" y="280" width="188" height="34" rx="17" fill="#E8EEFF"/>
    <text x="362" y="302" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#0033CC">如：分析新品月度销售</text>
  </g>

  <!-- 卡片 3：背景与资料（描边） — 1.2s -->
  <g>
    <rect x="488" y="30" width="196" height="320" rx="8" fill="#FAFBFF" stroke="#C5D4F5" stroke-width="1.5"/>
    <path d="M488,42 Q488,30 500,30 L672,30 Q684,30 684,42 L684,84 L488,84 Z" fill="none" stroke="#0033CC" stroke-width="2"/>
    <text x="586" y="63" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#0033CC">背景与资料</text>
    <g transform="translate(586,130)">
      <rect x="-14" y="-14" width="28" height="34" rx="3" fill="#E8EEFF" stroke="#0033CC" stroke-width="1.2"/>
      <rect x="-6" y="-20" width="28" height="34" rx="3" fill="#fff" stroke="#0033CC" stroke-width="1.2"/>
      <line x1="-1" y1="-11" x2="15" y2="-11" stroke="#0033CC" stroke-width="1.2" opacity="0.4"/>
      <line x1="-1" y1="-5" x2="15" y2="-5" stroke="#0033CC" stroke-width="1.2" opacity="0.4"/>
      <line x1="-1" y1="1" x2="10" y2="1" stroke="#0033CC" stroke-width="1.2" opacity="0.4"/>
    </g>
    <text x="586" y="200" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#333">给出可用的数据</text>
    <text x="586" y="225" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#333">补上已知的背景</text>
    <rect x="492" y="280" width="188" height="34" rx="17" fill="#E8EEFF"/>
    <text x="586" y="302" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#0033CC">如：销售表·活动·客服</text>
  </g>

  <!-- 卡片 4：输出要求（实填） — 1.6s -->
  <g>
    <rect x="712" y="30" width="196" height="320" rx="8" fill="#FAFBFF" stroke="#C5D4F5" stroke-width="1.5"/>
    <path d="M712,42 Q712,30 724,30 L896,30 Q908,30 908,42 L908,84 L712,84 Z" fill="#0033CC"/>
    <text x="810" y="63" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#fff">输出要求</text>
    <g transform="translate(810,130)">
      <rect x="-15" y="-16" width="30" height="36" rx="3" fill="#fff" stroke="#0033CC" stroke-width="1.2"/>
      <line x1="-9" y1="-8" x2="9" y2="-8" stroke="#0033CC" stroke-width="1.2" opacity="0.4"/>
      <line x1="-9" y1="-2" x2="9" y2="-2" stroke="#0033CC" stroke-width="1.2" opacity="0.4"/>
      <path d="M-6,8 L-2,12 L8,3" fill="none" stroke="#0033CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="810" y="200" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#333">定好格式与结构</text>
    <text x="810" y="225" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#333">写明硬性规则</text>
    <rect x="716" y="280" width="188" height="34" rx="17" fill="#E8EEFF"/>
    <text x="810" y="302" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#0033CC">如：Markdown 四部分</text>
  </g>
</svg>
