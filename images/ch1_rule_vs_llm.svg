<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260">
  <!-- 设计意图：用线性流程展示 AI 应用能力从规则系统到 Agent 应用的演进 -->
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0033CC"/>
      <stop offset="100%" stop-color="#6281E0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0033CC" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="260" rx="8" fill="#FFFFFF"/>
  <rect x="48" y="20" width="864" height="200" rx="16" fill="#E8EEFF"/>

  <rect x="64" y="50" width="128" height="148" rx="10" fill="#FFFFFF" stroke="#0033CC" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="82" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="15" font-weight="700" fill="#0033CC">规则系统应用</text>
  <text x="128" y="118" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">按人工规则判断</text>
  <line x1="88" y1="142" x2="168" y2="142" stroke="#E4E7EC" stroke-width="1"/>
  <text x="128" y="168" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FF6A00">规则写不完</text>

  <line x1="200" y1="142" x2="226" y2="142" stroke="#5E5E5E" stroke-width="1.5" opacity="0.65"/>
  <polygon points="226,142 216,136 216,148" fill="#5E5E5E" opacity="0.75"/>

  <rect x="240" y="50" width="128" height="148" rx="10" fill="#FFFFFF" stroke="#0033CC" stroke-width="2" filter="url(#shadow)"/>
  <text x="304" y="82" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="15" font-weight="700" fill="#0033CC">机器学习应用</text>
  <text x="304" y="118" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">从数据里找规律</text>
  <line x1="264" y1="142" x2="344" y2="142" stroke="#E4E7EC" stroke-width="1"/>
  <text x="304" y="168" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FF6A00">一个任务一个模型</text>

  <line x1="376" y1="142" x2="402" y2="142" stroke="#5E5E5E" stroke-width="1.5" opacity="0.65"/>
  <polygon points="402,142 392,136 392,148" fill="#5E5E5E" opacity="0.75"/>

  <rect x="416" y="50" width="128" height="148" rx="10" fill="#FFFFFF" stroke="#0033CC" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="82" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="15" font-weight="700" fill="#0033CC">深度学习应用</text>
  <text x="480" y="118" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">处理图像、语音等</text>
  <line x1="440" y1="142" x2="520" y2="142" stroke="#E4E7EC" stroke-width="1"/>
  <text x="480" y="168" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FF6A00">换任务要重训</text>

  <line x1="552" y1="142" x2="578" y2="142" stroke="#5E5E5E" stroke-width="1.5" opacity="0.65"/>
  <polygon points="578,142 568,136 568,148" fill="#5E5E5E" opacity="0.75"/>

  <rect x="592" y="50" width="128" height="148" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="656" y="82" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="15" font-weight="700" fill="#FFFFFF">大模型服务</text>
  <text x="656" y="118" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FFFFFF">理解与生成</text>
  <text x="656" y="146" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#FFFFFF">能处理多种任务</text>

  <line x1="728" y1="142" x2="754" y2="142" stroke="#5E5E5E" stroke-width="1.5" opacity="0.65"/>
  <polygon points="754,142 744,136 744,148" fill="#5E5E5E" opacity="0.75"/>

  <rect x="768" y="50" width="128" height="148" rx="10" fill="#FFF3EA" stroke="#FF6A00" stroke-width="2" filter="url(#shadow)"/>
  <text x="832" y="82" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="15" font-weight="700" fill="#FF6A00">Agent 应用</text>
  <text x="832" y="118" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">大模型+工具+记忆</text>
  <text x="832" y="146" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" fill="#5E5E5E">端到端完成任务</text>

  <rect x="198" y="214" width="564" height="34" rx="8" fill="#FFFFFF" stroke="#0033CC" stroke-width="1.5"/>
  <text x="480" y="236" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#000000">从“按规则执行”到“理解内容并调用工具完成任务”</text>
</svg>
