<!-- 模式：机制图 — 上下文窗口截断 -->
<!-- 左：输入上下文（对话历史、RAG 检索内容不断膨胀）；右：大模型 -->
<!-- 红框 = 上下文窗口 200k tokens；框外内容被截断，大模型看不到 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 641 556">
  <rect width="100%" height="100%" fill="#fff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0033CC"/>
    </marker>
  </defs>

  <!-- 面板标题 -->
  <text x="24" y="36" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#5E5E5E">输入上下文</text>

  <!-- 左面板（高度 448：底部留白 32，与顶部红框上方留白一致，上下对称） -->
  <rect x="24" y="48" width="320" height="448" fill="#FAFBFF" stroke="#D0D8F0" stroke-width="1"/>

  <!-- 红框标注（随红框淡入） -->
  <text x="46" y="70" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#E63E33" opacity="0">上下文窗口 · 200k tokens
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.36;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- 系统提示词 -->
  <rect x="46" y="88" width="276" height="36" fill="#E8EEFF" stroke="#0033CC" stroke-width="1"/>
  <text x="62" y="111" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">系统提示词</text>
  <text x="308" y="111" text-anchor="end" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#5E5E5E">~2k</text>

  <!-- 记忆 -->
  <rect x="46" y="132" width="276" height="36" fill="#E8EEFF" stroke="#0033CC" stroke-width="1"/>
  <text x="62" y="155" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">记忆</text>
  <text x="308" y="155" text-anchor="end" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#5E5E5E">~10k</text>

  <!-- MCP 工具 -->
  <rect x="46" y="176" width="276" height="56" fill="#E8EEFF" stroke="#0033CC" stroke-width="1"/>
  <text x="62" y="209" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">MCP 工具</text>
  <text x="308" y="209" text-anchor="end" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#5E5E5E">~80k</text>

  <!-- 技能 -->
  <rect x="46" y="240" width="276" height="36" fill="#E8EEFF" stroke="#0033CC" stroke-width="1"/>
  <text x="62" y="263" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">技能</text>
  <text x="308" y="263" text-anchor="end" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#5E5E5E">~6k</text>

  <!-- 对话历史（拉高 40→64 + 数字切换 25k→60k） -->
  <rect x="46" y="284" width="276" height="40" fill="#E8EEFF" stroke="#0033CC" stroke-width="1">
    <animate attributeName="height" values="40;40;64;64" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="62" y="309" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">对话历史
    <animate attributeName="y" values="309;309;321;321" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="308" y="309" text-anchor="end" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#5E5E5E">~25k
    <animate attributeName="y" values="309;309;321;321" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="308" y="309" text-anchor="end" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#FF6A00" opacity="0">~60k
    <animate attributeName="y" values="309;309;321;321" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- RAG 检索内容（橙色主角：拉高 36→72 + 数字切换 8k→80k；文字贴顶，保证截断后仍露出） -->
  <rect x="46" y="332" width="276" height="36" fill="#FFF4EA" stroke="#FF6A00" stroke-width="1">
    <animate attributeName="y" values="332;332;356;356" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="height" values="36;36;72;72" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="62" y="355" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#FF6A00">RAG 检索内容
    <animate attributeName="y" values="355;355;379;379" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="308" y="355" text-anchor="end" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#FF6A00">~8k
    <animate attributeName="y" values="355;355;379;379" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="308" y="355" text-anchor="end" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#FF6A00" opacity="0">~80k
    <animate attributeName="y" values="355;355;379;379" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- 更多内容（随之下移，最终被灰遮罩淹没） -->
  <rect x="46" y="376" width="276" height="28" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1">
    <animate attributeName="y" values="376;376;436;436" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="184" y="395" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#999999">······（更多内容）
    <animate attributeName="y" values="395;395;455;455" keyTimes="0;0.11;0.28;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- 红框：上下文窗口 200k，从上往下扫描，在 RAG 检索内容上拦腰截断 -->
  <rect x="38" y="80" width="296" height="0" fill="none" stroke="#E63E33" stroke-width="2" stroke-dasharray="8,4">
    <animate attributeName="height" values="0;0;312;312" keyTimes="0;0.28;0.39;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- 截断遮罩：框外内容盖灰 -->
  <rect x="38" y="392" width="296" height="72" fill="#F5F5F5" opacity="0">
    <animate attributeName="opacity" values="0;0;0.88;0.88" keyTimes="0;0.39;0.5;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="38" y="392" width="296" height="72" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="4,3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.39;0.5;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- 图例（随灰遮罩淡入） -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.39;0.5;1" dur="9s" repeatCount="indefinite"/>
    <rect x="38" y="510" width="12" height="12" fill="#F5F5F5" stroke="#999999" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="56" y="520" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5E5E5E">超出上下文窗口的部分，大模型看不到</text>
  </g>

  <!-- 箭头：窗口内的内容送入大模型（长度缩短为原 2/3，在面板与大模型之间居中，两端间隙均等） -->
  <line x1="360" y1="252" x2="461" y2="252" stroke="#0033CC" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.58;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- 大模型 -->
  <rect x="477" y="210" width="140" height="84" fill="#0033CC"/>
  <text x="547" y="247" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">大模型</text>
  <text x="547" y="269" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#B3C4FF">LLM</text>

  <!-- 底注 -->
  <text x="320" y="544" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#999999">上下文窗口不是无限的：塞得越多，真正相关的内容越容易被挤出窗口</text>
</svg>
