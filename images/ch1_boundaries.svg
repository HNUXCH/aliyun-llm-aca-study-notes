<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 960 270" role="img" aria-labelledby="title desc">
  <title id="title">大模型的三个边界</title>
  <desc id="desc">大模型有三个使用边界：上下文长度有限、训练数据有时间范围、生成内容可能出现幻觉。</desc>
  <defs>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8FF"/>
    </linearGradient>
    <linearGradient id="orangeCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <linearGradient id="violetCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0033CC" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="300" rx="8" fill="#FFFFFF"/>

  <g transform="translate(38 34)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="250" rx="16" fill="url(#blueCard)" stroke="#C9DAFF"/>
    <rect x="24" y="24" width="42" height="42" rx="12" fill="#E8EEFF"/>
    <path d="M34 45h22M45 34v22" fill="none" stroke="#0033CC" stroke-width="3.2" stroke-linecap="round"/>
    <text x="82" y="51" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="20" font-weight="800" fill="#0F172A">上下文长度有限</text>
    <text x="28" y="88" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" fill="#5E5E5E">上下文窗口不是无限的，装不了太多知识。</text>

    <rect x="28" y="116" width="224" height="38" rx="9" fill="#FFFFFF" stroke="#D7E5FF"/>
    <text x="44" y="140" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0F172A">长文档需要拆分</text>
    <rect x="28" y="164" width="224" height="38" rx="9" fill="#FFFFFF" stroke="#D7E5FF"/>
    <text x="44" y="188" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0F172A">提供与问题相关的资料</text>

    <rect x="62" y="218" width="156" height="24" rx="12" fill="#E8EEFF"/>
    <text x="140" y="235" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#0033CC">提取有效信息交给模型</text>
  </g>

  <g transform="translate(340 34)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="250" rx="16" fill="url(#orangeCard)" stroke="#FED7AA"/>
    <rect x="24" y="24" width="42" height="42" rx="12" fill="#FFF1E6"/>
    <path d="M45 36v12l10 7" fill="none" stroke="#FF6A00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="45" cy="45" r="14" fill="none" stroke="#FFB26B" stroke-width="2"/>
    <text x="82" y="51" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="20" font-weight="800" fill="#0F172A">训练数据有时效</text>
    <text x="28" y="88" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" fill="#5E5E5E">训练数据通常来自几个月前。</text>

    <rect x="28" y="116" width="224" height="38" rx="9" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="44" y="140" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0F172A">补充最新资料</text>
    <rect x="28" y="164" width="224" height="38" rx="9" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="44" y="188" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0F172A">必要时接入工具</text>

    <rect x="62" y="218" width="156" height="24" rx="12" fill="#FFF1E6"/>
    <text x="140" y="235" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#FF6A00">让模型看到最新的资料</text>
  </g>

  <g transform="translate(642 34)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="250" rx="16" fill="url(#violetCard)" stroke="#DAD4F4"/>
    <rect x="24" y="24" width="42" height="42" rx="12" fill="#E8EEFF"/>
    <g transform="translate(-2 -2) scale(0.9 0.9) translate(5 5)">
      <path d="M39 41c3-7 15-7 18 0 3 7-5 10-10 14v3" fill="none" stroke="#0033CC" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="47" cy="63" r="2.5" fill="#0033CC"/>
    </g>
    <text x="82" y="51" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="20" font-weight="800" fill="#0F172A">可能产生幻觉</text>
    <text x="28" y="88" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" fill="#5E5E5E">说得流畅，不等于事实正确。</text>

    <rect x="28" y="116" width="224" height="38" rx="9" fill="#FFFFFF" stroke="#DAD4F4"/>
    <text x="44" y="140" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0F172A">关键指标要能溯源</text>
    <rect x="28" y="164" width="224" height="38" rx="9" fill="#FFFFFF" stroke="#DAD4F4"/>
    <text x="44" y="188" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="13" font-weight="700" fill="#0F172A">安全边界人工把控</text>

    <rect x="62" y="218" width="156" height="24" rx="12" fill="#FFF7ED" stroke="#FFB26B"/>
    <text x="140" y="235" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial, Tahoma" font-size="12" font-weight="700" fill="#FF6A00">关键内容需要人工确认</text>
  </g>
</svg>
