<!-- 模式：双层架构图 — 智能问答系统 -->
<!-- 上层：知识怎么来的（企业知识库多路检索融合 + 多源信息） -->
<!-- 下层：在线问答怎么做（意图理解 → 上下文工程 → 大模型生成） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496">
  <rect width="100%" height="100%" fill="#fff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0033CC"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00C5FF"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00C87E"/>
    </marker>
  </defs>

  <!-- ========== 标题 ========== -->
  <text x="480" y="30" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">智能问答系统全景：知识从哪来 · 问答怎么做</text>

  <!-- ══════════ 上半部分：知识怎么来的 ══════════ -->
  <text x="24" y="56" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="#5E5E5E">知识怎么来的（离线建设）</text>

  <!-- 通路A：企业知识库（加宽） -->
  <rect x="20" y="64" width="648" height="208" fill="none" stroke="#D0D8F0" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="36" y="84" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#5E5E5E">通路A · 企业知识库</text>

