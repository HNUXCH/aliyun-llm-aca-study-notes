  <text x="814" y="168" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5E5E5E">本地文档 · 私有资料</text>

  <rect x="708" y="182" width="212" height="36" fill="#F4FBFF" stroke="#00C5FF" stroke-width="1.2"/>
  <text x="814" y="198" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">关系数据库</text>
  <text x="814" y="212" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5E5E5E">SQL 直查 · 销量 / 均价</text>

  <rect x="708" y="226" width="212" height="36" fill="#F4FBFF" stroke="#00C5FF" stroke-width="1.2"/>
