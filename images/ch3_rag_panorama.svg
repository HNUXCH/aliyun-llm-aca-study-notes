  <!-- ========== 底注 ========== -->
  <text x="480" y="470" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#999">上层：多模态数据沉淀为企业知识库，多路检索融合；下层：意图理解 → 上下文工程（① + ② + 问题）→ 大模型生成答案</text>
