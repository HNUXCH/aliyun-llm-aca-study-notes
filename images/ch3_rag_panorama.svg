  <text x="461" y="143" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5E5E5E">BM25 · 编号 / 名称精确匹配</text>

  <rect x="384" y="154" width="154" height="40" fill="#fff" stroke="#0033CC" stroke-width="1.2"/>
  <text x="461" y="171" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">混合检索</text>
  <text x="461" y="187" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5E5E5E">关键词 + 向量 协同召回</text>

  <rect x="384" y="198" width="154" height="40" fill="#fff" stroke="#0033CC" stroke-width="1.2"/>
  <text x="461" y="215" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">向量数据库检索</text>
  <text x="461" y="231" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#5E5E5E">Embedding · 语义相似</text>

  <!-- 三个检索方法 → 多路检索融合（明确汇入） -->
  <path d="M538,130 C552,130 566,158 578,164" fill="none" stroke="#0033CC" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <line x1="538" y1="174" x2="578" y2="174" stroke="#0033CC" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <path d="M538,218 C552,218 566,194 578,188" fill="none" stroke="#0033CC" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)">
