<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0033CC"/>
      <stop offset="1" stop-color="#4A6FE3"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0033CC" flood-opacity="0.14"/>
    </filter>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8A8A8A"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="19" font-weight="800" fill="#0033CC">大模型应用的五层栈</text>
  <text x="480" y="58" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="12" fill="#5E5E5E">Graph 站在前四层之上，不替代任何一层</text>

  <!-- ═══ 五层栈：自下而上堆叠，颜色由浅入深 ═══ -->

  <!-- 第 5 层 Graph（顶层，深蓝渐变） -->
  <rect x="200" y="95" width="560" height="74" rx="8" fill="url(#topGrad)" filter="url(#shadow)"/>
  <text x="480" y="123" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="16" font-weight="800" fill="#FFFFFF">5 · Graph</text>
  <text x="480" y="145" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="12" fill="#C8D6FF">组织多个 Agent 协作</text>

  <!-- 第 4 层 Loop -->
  <rect x="200" y="175" width="560" height="74" rx="8" fill="#C3D4FC" stroke="#8FA8F0" stroke-width="1"/>
  <text x="480" y="203" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="16" font-weight="700" fill="#0033CC">4 · Loop</text>
  <text x="480" y="225" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="12" fill="#5E5E5E">控制循环、纠错与停止</text>

  <!-- 第 3 层 Harness -->
  <rect x="200" y="255" width="560" height="74" rx="8" fill="#D3E0FE" stroke="#A3BCF7" stroke-width="1"/>
  <text x="480" y="283" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="16" font-weight="700" fill="#0033CC">3 · Harness</text>
  <text x="480" y="305" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="12" fill="#5E5E5E">约束工具、权限与规则</text>

  <!-- 第 2 层 Context -->
  <rect x="200" y="335" width="560" height="74" rx="8" fill="#E1EAFF" stroke="#B8CBFA" stroke-width="1"/>
  <text x="480" y="363" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="16" font-weight="700" fill="#0033CC">2 · Context</text>
  <text x="480" y="385" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="12" fill="#5E5E5E">管理模型看到的信息</text>

  <!-- 第 1 层 Prompt（底层，最浅） -->
  <rect x="200" y="415" width="560" height="74" rx="8" fill="#EEF3FF" stroke="#C7D6FF" stroke-width="1"/>
  <text x="480" y="443" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="16" font-weight="700" fill="#0033CC">1 · Prompt</text>
  <text x="480" y="465" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="12" fill="#5E5E5E">定义基础提示词与风格</text>

  <!-- 堆叠方向（右侧向上箭头） -->
  <path d="M820 482 V112" fill="none" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="820" y="98" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, Arial" font-size="11" fill="#8A8A8A">自下而上堆叠</text>
</svg>
